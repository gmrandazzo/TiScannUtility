name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            qtbase5-dev \
            libqt5svg5-dev \
            libsane-dev \
            libpoppler-qt5-dev \
            poppler-utils \
            file \
            wget

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Run verification test
        run: |
          QT_QPA_PLATFORM=offscreen ./build/TiScannUtility --pdftest
          ctest --test-dir build --output-on-failure

      - name: Install to AppDir
        run: |
          DESTDIR=AppDir cmake --install build

      - name: Package AppImage with linuxdeploy
        run: |
          wget -q -nc https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -nc https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=/usr/lib/qt5/bin/qmake

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e build/TiScannUtility \
            -d cmake/TiScannUtility.desktop \
            -i cmake/TiScannUtility.svg \
            --plugin qt \
            --output appimage

          # Ensure correct name without failing if it's already correct
          for f in TiScannUtility*.AppImage; do
            if [ "$f" != "TiScannUtility-x86_64.AppImage" ]; then
              mv "$f" TiScannUtility-x86_64.AppImage
            fi
          done

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiScannUtility-Linux
          path: TiScannUtility-x86_64.AppImage

  build-macos:
    name: Build macOS Application Bundle (Universal)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Run verification test
        run: |
          QT_QPA_PLATFORM=offscreen ./build/TiScannUtility.app/Contents/MacOS/TiScannUtility --pdftest
          ctest --test-dir build --output-on-failure

      - name: Package macOS App Bundle
        run: |
          macdeployqt build/TiScannUtility.app || true
          ditto -c -k --sequesterRsrc --keepParent build/TiScannUtility.app TiScannUtility-macOS-Universal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiScannUtility-macOS-Universal
          path: TiScannUtility-macOS-Universal.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
